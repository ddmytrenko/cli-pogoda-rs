[package]
name = "cli-pogoda-rs"
version = "0.1.0"
edition = "2021"
description = "IMGW-PIB point weather nowcast for the terminal"
license = "MIT"

[lib]
name = "pogoda"
path = "src/lib.rs"

[[bin]]
name = "pogoda"
path = "src/main.rs"

[dependencies]
anyhow = "1"
ureq = { version = "2.10", features = ["gzip", "tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
terminal_size = "0.4"
geo = "0.33.1"
geojson = "1.0.0"
rand = { version = "0.10", default-features = false, features = ["sys_rng"] }

[dev-dependencies]
mockito = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"

[profile.release]
strip = true
lto = true
opt-level = "z"
