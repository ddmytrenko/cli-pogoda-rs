[package]
name = "imgw-rs"
version = "0.1.0"
edition = "2021"
description = "IMGW-PIB point weather nowcast for the terminal (a Rust port of the zsh `imgw` command)"
license = "MIT"

[[bin]]
name = "imgw"
path = "src/main.rs"

[dependencies]
anyhow = "1"
ureq = { version = "2.10", features = ["gzip", "tls"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"

[dev-dependencies]
mockito = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"

[profile.release]
strip = true
lto = true
opt-level = "z"
