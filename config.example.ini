# imgw configuration.
# Copy to $XDG_CONFIG_HOME/pogoda-rs/config.ini (usually ~/.config/pogoda-rs/config.ini).

# Default location, used when `pogoda` is run with no argument.
# Either a "City,CC" name or "lat,lon" coordinates:
#   weather_place = Warsaw,PL
#   weather_place = 52.2298,21.0118
weather_place = Warsaw,PL

# How far the forecast reaches:
#   tomorrow  (default) cap at the end of tomorrow (Poland time)
#   full      show everything IMGW provides (~64h)
forecast_horizon = tomorrow
